name: Check

on:
  push:
  pull_request:

jobs:
  quality:
    name: ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm-gc
          - os: macos-latest
            target: wasm-gc
          - os: windows-latest
            target: wasm-gc
          - os: ubuntu-latest
            target: native
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: "0.1.20260814"
      - run: node --test tools/verify-docs.test.mjs
      - run: node tools/verify-docs.mjs
      - run: moon fmt --check
      - run: moon check --target all --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon info
      - run: git diff --exit-code
