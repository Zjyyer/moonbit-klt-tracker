name: Check

on:
  push:
  pull_request:

jobs:
  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: "0.1.20260713"
      - run: node --test tools/verify-docs.test.mjs
      - run: node tools/verify-docs.mjs
      - run: moon fmt --check
      - run: moon check --target all --deny-warn
      - run: moon test --target all --deny-warn
      - run: moon info
      - run: git diff --exit-code
