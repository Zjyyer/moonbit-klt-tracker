name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: moonbitlang/setup-moonbit@v1
        with:
          # moonc v0.10.9 (moon 0.1.20260819)
          version: "0.1.20260819"
      - run: moon bench benchmarks --target wasm-gc --release --deny-warn
